<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Design Card Premium Review</title>
  <style>
    :root {
      --bg: #f7f5f1;
      --panel: #fffdfa;
      --panel-strong: #ffffff;
      --text: #1f2328;
      --muted: #6f6a62;
      --muted-strong: #5c564f;
      --border: #e8e0d5;
      --border-soft: rgba(95, 84, 70, 0.08);
      --shadow: 0 20px 40px rgba(61, 49, 34, 0.08);
      --teal: #15959a;
      --teal-soft: rgba(21, 149, 154, 0.12);
      --chip: #f4efe7;
      --navy: #4b5563;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at top left, rgba(21, 149, 154, 0.08), transparent 26%),
        radial-gradient(circle at bottom right, rgba(75, 85, 99, 0.08), transparent 28%),
        linear-gradient(180deg, #fbfaf8 0%, #f4f1eb 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      color: var(--text);
    }

    .frame {
      width: 664px;
      padding: 28px;
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.66);
      box-shadow: 0 28px 60px rgba(87, 72, 52, 0.10);
      backdrop-filter: blur(16px);
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: 32px;
      border: 1px solid var(--border);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(253, 250, 244, 0.94) 100%);
      box-shadow: var(--shadow);
      padding: 30px 30px 26px;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top right, rgba(21, 149, 154, 0.08), transparent 24%),
        radial-gradient(circle at left center, rgba(75, 85, 99, 0.05), transparent 28%);
      pointer-events: none;
    }

    .top-row {
      position: relative;
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 20px;
      align-items: start;
      margin-bottom: 24px;
    }

    .swatch {
      width: 92px;
      height: 92px;
      border-radius: 24px;
      background:
        linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0) 32%),
        var(--navy);
      border: 1px solid rgba(255,255,255,0.7);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.24),
        0 12px 24px rgba(48, 57, 70, 0.16);
    }

    .content {
      min-width: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.8);
      color: var(--muted-strong);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(180deg, #818894 0%, #525b68 100%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 27px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .brand-line {
      margin: 0 0 8px;
      font-size: 19px;
      line-height: 1.2;
      color: var(--muted-strong);
      font-weight: 500;
    }

    .saved-line {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    .meta-row {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--chip);
      color: var(--muted-strong);
      font-size: 15px;
      font-weight: 600;
    }

    .chip svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      opacity: 0.78;
    }

    .footer-note {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 18px;
      border-top: 1px solid var(--border-soft);
    }

    .footer-copy {
      font-size: 15px;
      line-height: 1.35;
      color: var(--muted);
    }

    .footer-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(21, 149, 154, 0.18);
      background: var(--teal-soft);
      color: var(--teal);
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .footer-action svg {
      width: 16px;
      height: 16px;
    }
  </style>
</head>
<body>
  <main class="frame">
    <section class="card" aria-label="Premium saved design card concept">
      <div class="top-row">
        <div class="swatch" aria-hidden="true"></div>
        <div class="content">
          <div class="badge">
            <span class="badge-dot" aria-hidden="true"></span>
            Saved Color Story
          </div>
          <h1>Hale Navy</h1>
          <p class="brand-line">Benjamin Moore • HC-154</p>
          <p class="saved-line">Saved Mar 14, 2026 at 9:55 PM</p>
        </div>
      </div>

      <div class="meta-row">
        <div class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="4" width="16" height="16" rx="2"></rect>
            <path d="M8 16 16 8"></path>
          </svg>
          Full Walls
        </div>
      </div>

      <div class="footer-note">
        <div class="footer-copy">A polished design card and share link are ready for export.</div>
        <div class="footer-action">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 16V7"></path>
            <path d="m8.5 10.5 3.5-3.5 3.5 3.5"></path>
            <path d="M6 17.5h12"></path>
          </svg>
          Share Design Card
        </div>
      </div>
    </section>
  </main>
</body>
</html>
