name: CrainPaintVisualizer
options:
  bundleIdPrefix: com.crainpainting
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PMFQA4TKBG
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_NSCameraUsageDescription: "We need camera access to photograph your room for paint visualization"
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "We need photo library access to select room photos for paint visualization"
packages:
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm
    from: 24.8.0
targets:
  CrainPaintVisualizer:
    type: application
    platform: iOS
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Crain Paint"
        API_BASE_URL: "https://crain-paint-visualizer-ios-backend.vercel.app"
        NSCameraUsageDescription: "We need camera access to photograph your room for paint visualization"
        NSPhotoLibraryUsageDescription: "We need photo library access to select room photos for paint visualization"
        STRIPE_MERCHANT_IDENTIFIER: "merchant.com.crainpainting.visualizer"
    dependencies:
      - package: Stripe
        product: StripePaymentSheet
    sources:
      - path: Sources
        type: group
    resources:
      - path: Sources/Resources
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crainpainting.visualizer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
  CrainPaintVisualizerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
        type: group
    dependencies:
      - target: CrainPaintVisualizer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crainpainting.visualizerTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CrainPaintVisualizer.app/CrainPaintVisualizer"
        BUNDLE_LOADER: "$(TEST_HOST)"
  CrainPaintVisualizerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
        type: group
    dependencies:
      - target: CrainPaintVisualizer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crainpainting.visualizerUITests
        GENERATE_INFOPLIST_FILE: true
schemes:
  CrainPaintVisualizer:
    build:
      targets:
        CrainPaintVisualizer: all
    test:
      targets:
        - CrainPaintVisualizerTests
        - CrainPaintVisualizerUITests
